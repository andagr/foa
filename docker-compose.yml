services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/src/game_server
    volumes:
      - .:/workspace
    ports:
      - "4000:4000"
    depends_on:
      - db

volumes:
  db_data:
